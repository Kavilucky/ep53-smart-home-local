# Сценарий 1: свет по движению ночью.
# ПРИМЕР по документации Home Assistant (синтаксис triggers / conditions / actions): проверьте на своём стенде.
# Замените сущности на свои: binary_sensor.hallway_motion_occupancy и light.hallway.
# Вполсилы и тёплым оттенком: brightness_pct 50, color_temp_kelvin 2700 (если лампа не поддерживает цветовую температуру, уберите строку).

- id: night_hallway_light_on
  alias: Коридор, свет по движению ночью
  description: После заката включить свет вполсилы тёплым оттенком, когда в коридоре есть движение.
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.hallway_motion_occupancy
      to: "on"
  conditions:
    - condition: state
      entity_id: sun.sun
      state: below_horizon
  actions:
    - action: light.turn_on
      target:
        entity_id: light.hallway
      data:
        brightness_pct: 50
        color_temp_kelvin: 2700

- id: night_hallway_light_off
  alias: Коридор, выключить свет без движения
  description: Через две минуты без движения выключить свет.
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.hallway_motion_occupancy
      to: "off"
      for:
        minutes: 2
  actions:
    - action: light.turn_off
      target:
        entity_id: light.hallway
