# Вспомогательные сущности для сценария «ухожу из дома» (добавьте в configuration.yaml и перезагрузите YAML-конфигурацию).
# ПРИМЕР по документации Home Assistant: проверьте на своём стенде.
# Вместо виртуальной кнопки можно использовать физическую Zigbee-кнопку: её событие выбирается триггером устройства в редакторе автоматизации.

input_button:
  leaving_home:
    name: Ухожу из дома
    icon: mdi:door-open

input_boolean:
  away_mode:
    name: Режим охраны (никого нет дома)
    icon: mdi:shield-home
